[project]
name = "sheet-music-trainer-backend"
version = "0.2.0"
description = "Backend for Sheet Music Trainer: OMR (homr → MusicXML) + performance analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "homr>=0.7.0",
    "music21>=9.1",
    # Performance analysis (/analyze): pitch tracking + audio decode.
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
